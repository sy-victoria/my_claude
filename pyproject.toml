[project]
name = "minicode"
version = "0.1.0"
description = "从零复现一个 Claude Code 风格的 coding agent，用于学习 agent 架构"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
]

[project.scripts]
minicode = "minicode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minicode"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
