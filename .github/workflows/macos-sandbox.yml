name: macOS Docker sandbox acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install local Docker runtime
        run: |
          brew install colima docker
          colima start --runtime docker --cpu 2 --memory 4 --disk 20
          docker info
          docker pull python:3.11.11-slim-bookworm
      - name: Install package and run desktop integration tests
        env:
          MINICODE_TEST_DOCKER: '1'
        run: |
          python -m pip install -e . pytest
          python -m pytest -q
      - name: Stop local runtime
        if: always()
        run: colima stop || true
